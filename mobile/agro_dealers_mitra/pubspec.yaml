name: agro_dealers_mitra
description: "Agro Dealers Mitra - licence renewal tracking for agricultural input dealers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  pinput: ^5.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  background_image: assets/splash/splash_background.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#FFC107"