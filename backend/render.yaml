databases:
  - name: agro-dealers-mitra-db
    plan: starter
    databaseName: agro_dealers_mitra_db
    user: agro_dealers_mitra

services:
  - type: web
    name: agro-dealers-mitra-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agro-dealers-mitra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "api.agrodealersmitra.in"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.agrodealersmitra.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://agrodealersmitra.in,https://www.agrodealersmitra.in"
      - key: FIREBASE_CREDENTIALS_PATH
        value: "/etc/secrets/firebase-service-account.json"
      - key: PYTHON_VERSION
        value: "3.13.0"

  # Runs the reminder scan daily at 9:00 AM IST (03:30 UTC).
  - type: cron
    name: agro-dealers-mitra-send-reminders
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "30 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_reminders"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agro-dealers-mitra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "api.agrodealersmitra.in"
      - key: FIREBASE_CREDENTIALS_PATH
        value: "/etc/secrets/firebase-service-account.json"
      - key: PYTHON_VERSION
        value: "3.13.0"
